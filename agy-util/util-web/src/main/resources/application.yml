server:
  port: 9202
  shutdown: graceful

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: agy-util
  mvc:
    servlet:
      load-on-startup: 1
  lifecycle:
    timeout-per-shutdown-phase: 30s
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

framework:
  security:
    cors:
      allow-credentials: true
      # 开发/本地环境默认允许的前端 Origin
      allowed-origin-patterns:
        - "http://localhost:*"
        - "http://127.0.0.1:*"
    token:
      access-token-ttl: 7200 # 访问令牌有效时长(秒): 7200秒 = 2小时
      refresh-token-ttl: 604800 # 刷新令牌有效时长(秒): 604800秒 = 7天 (用于无感静默刷新)

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  file:
    path: /data/agy/log/${spring.application.name}

# GitLab 资产与代码统计配置
gitlab:
  url: ${GITLAB_URL:http://gitlab.example.com:10000/}
  token: ${GITLAB_TOKEN:glpat-your_gitlab_personal_access_token}

# 企业微信群机器人推送配置
wechat:
  webhook:
    default: ${WECHAT_WEBHOOK_DEFAULT:https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=your_wechat_robot_key}

# Swagger 文档在线解析默认地址
swagger:
  url: ${SWAGGER_DOC_URL:http://localhost:9202/v3/api-docs}
