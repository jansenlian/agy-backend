server:
  port: 9201
  shutdown: graceful

spring:
  profiles:
    active: dev
  application:
    name: agy-business-demo
  mvc:
    servlet:
      load-on-startup: 1
  lifecycle:
    timeout-per-shutdown-phase: 30s

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  file:
    path: /data/agy/log/${spring.application.name}

# 框架安全认证配置 (Token 2小时/7天双令牌；RSA 密钥对由 Redis 零配置全自动托管)
framework:
  security:
    token:
      access-token-ttl: 7200 # 访问令牌有效时长(秒): 7200秒 = 2小时
      refresh-token-ttl: 604800 # 刷新令牌有效时长(秒): 604800秒 = 7天 (用于无感静默刷新)
