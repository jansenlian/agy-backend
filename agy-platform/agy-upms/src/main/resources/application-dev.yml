# ===================================================================
# 开发环境 (dev) 专属配置：开发数据库、开发 Redis、Swagger 与本地 CORS
# ===================================================================
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agy_db?stringtype=unspecified&currentSchema=public}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

framework:
  security:
    cors:
      allow-credentials: true
      # 本地前端开发联调允许的 Origin
      allowed-origin-patterns:
        - "http://localhost:*"
        - "http://127.0.0.1:*"

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
