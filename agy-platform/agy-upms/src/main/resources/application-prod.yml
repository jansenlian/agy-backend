# ===================================================================
# 生产环境 (prod) 专属配置：生产数据库、生产 Redis、关闭文档与严格域名白名单
# ===================================================================
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/agy_db?stringtype=unspecified&currentSchema=public}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:${REDIS_HOST:localhost}}
      port: ${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}
      password: ${SPRING_DATA_REDIS_PASSWORD:${REDIS_PASSWORD:}}
      database: ${SPRING_DATA_REDIS_DATABASE:0}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

framework:
  security:
    cors:
      # 生产环境精细化 CORS 跨域安全隔离白名单 (严禁在生产开启 localhost / 127.0.0.1 或带凭据的通配符)
      allowed-origin-patterns:
        - "https://app.greatmap.com"
        - "https://admin.greatmap.com"
