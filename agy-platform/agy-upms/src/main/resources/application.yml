server:
  port: 9200
  address: 0.0.0.0
  servlet:
    context-path: /

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: agy-platform
  main:
    allow-bean-definition-overriding: true
  mvc:
    servlet:
      load-on-startup: 1
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

framework:
  security:
    cors:
      allow-credentials: true
      # 开发/本地环境默认允许的前端 Origin
      allowed-origin-patterns:
        - "http://localhost:*"
        - "http://127.0.0.1:*"
    token:
      access-token-ttl: 7200 # 访问令牌有效时长(秒): 7200秒 = 2小时
      refresh-token-ttl: 604800 # 刷新令牌有效时长(秒): 604800秒 = 7天 (用于无感静默刷新)

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  file:
    path: /data/${spring.application.name}/log
